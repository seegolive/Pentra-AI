[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentra-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.3.6",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "miniopy-async>=1.21",
    "pentra-knowledge",
    "pentra-shared",
    "feedparser>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
pentra-knowledge = { path = "../../packages/pentra-knowledge", editable = true }
pentra-shared    = { path = "../../packages/pentra-shared",    editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
