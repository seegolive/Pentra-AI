[project]
name = "pentra-api"
version = "0.1.0"
description = "Pentra AI — REST API gateway"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [{ name = "Pentra AI Team" }]

dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pentra-knowledge",
    "pentra-shared",
    "pentra-scope",
    "pentra-agent",
    "pentra-tools",
    "pentra-report",
    "pentra-payload",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
    "redis[asyncio]>=5.0.0",
    "pypdf>=4.0.0",
    "feedparser>=6.0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pentra-knowledge = { path = "../../packages/pentra-knowledge", editable = true }
pentra-shared    = { path = "../../packages/pentra-shared",    editable = true }
pentra-scope     = { path = "../../packages/pentra-scope",     editable = true }
pentra-agent     = { path = "../../packages/pentra-agent",     editable = true }
pentra-tools     = { path = "../../packages/pentra-tools",     editable = true }
pentra-report    = { path = "../../packages/pentra-report",    editable = true }
pentra-payload   = { path = "../../packages/pentra-payload",   editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
