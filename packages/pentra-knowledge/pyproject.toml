[project]
name = "pentra-knowledge"
version = "0.1.0"
description = "Knowledge Engine — ingestion, embedding, and hybrid search for Pentra AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [{ name = "Pentra AI Team" }]

dependencies = [
    # HTTP framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Vector DB
    "qdrant-client>=1.9.0",

    # Ollama / LLM
    "httpx>=0.27.0",          # async HTTP for Ollama REST calls
    "openai>=1.30.0",         # OpenAI-compatible client for Ollama

    # Task queue
    "celery[redis]>=5.4.0",

    # CLI / progress
    "tqdm>=4.66.0",

    # Settings
    "pydantic-settings>=2.3.0",
    "pydantic>=2.0",

    # Shared types (local workspace package)
    "pentra-shared",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pentra_knowledge"]

[tool.uv.sources]
pentra-shared = { path = "../pentra-shared", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
