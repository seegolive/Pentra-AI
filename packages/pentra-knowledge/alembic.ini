# Alembic configuration for pentra-knowledge
# Run from packages/pentra-knowledge/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .

# URL is overridden in env.py from KnowledgeSettings to support env vars
sqlalchemy.url = postgresql+asyncpg://pentra:password@localhost:5432/pentra

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
