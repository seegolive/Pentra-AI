[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentra-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "httpx>=0.27.0",
    "pentra-shared",
    "pentra-scope",
    "pentra-knowledge",
    "pentra-tools",
]

[tool.hatch.build.targets.wheel]
packages = ["pentra_agent"]

[tool.uv.sources]
pentra-shared    = { path = "../../packages/pentra-shared",    editable = true }
pentra-scope     = { path = "../../packages/pentra-scope",     editable = true }
pentra-knowledge = { path = "../../packages/pentra-knowledge", editable = true }
pentra-tools     = { path = "../../packages/pentra-tools",     editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
