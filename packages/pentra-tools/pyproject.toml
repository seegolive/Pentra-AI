[project]
name = "pentra-tools"
version = "0.1.0"
description = "Pentra AI — Security tool wrappers (subfinder, nmap, nuclei, httpx, Burp MCP)"
requires-python = ">=3.11"
dependencies = [
    "pentra-scope",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
screenshot = [
    "playwright>=1.44.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
pentra-scope = { path = "../../packages/pentra-scope", editable = true }
