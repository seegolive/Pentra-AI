[project]
name = "pentra-payload"
version = "0.1.0"
description = "Pentra AI — Context-aware payload generator using LLM + RAG"
requires-python = ">=3.11"
dependencies = [
    "pentra-shared",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
pentra-shared = { path = "../../packages/pentra-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pentra_payload"]
