[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentra-report"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
    "markdown>=3.6.0",
    "weasyprint>=62.0",
    "pydantic>=2.0.0",
    "pentra-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["pentra_report"]

[tool.uv.sources]
pentra-shared = { path = "../../packages/pentra-shared", editable = true }
